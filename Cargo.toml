[package]
name = "lig"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Life is Graph — a native desktop application built with Rust and Iced"
repository = "https://github.com/adametsderschopfer/lig"
publish = false

[dependencies]
iced = { version = "0.14.0", features = ["fira-sans"] }

[dev-dependencies]
iced_test = "0.14.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
