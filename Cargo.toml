[package]
name = "lig"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Life is Graph — a native desktop application built with Rust and Iced"
repository = "https://github.com/adametsderschopfer/lig"
publish = false

[dependencies]
fluent-bundle = "0.16.0"
iced = { version = "0.14.0", features = ["fira-sans"] }
sys-locale = "0.3.2"
unic-langid = { version = "0.9.6", features = ["macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Enable the optional macOS fallback backends in Iced's wgpu dependency.
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan-portability", "angle"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6.2"

[dev-dependencies]
fluent-syntax = "0.12.0"
iced_test = "0.14.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
