name: Set up Rust platform dependencies
description: Install the pinned Rust toolchain and native Linux build dependencies.

inputs:
  components:
    description: Optional Rust toolchain components.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: 1.90.0
        components: ${{ inputs.components }}
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libudev-dev
